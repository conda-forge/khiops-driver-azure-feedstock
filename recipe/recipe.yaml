context:
  version: "0.0.33"

package:
  name: khiops-driver-azure
  version: ${{ version }}

source:
  - url: https://github.com/KhiopsML/khiops-drivers/archive/refs/tags/${{ version }}.tar.gz
    sha256: f797a7f5f0b7d7e80c67a02b7e4c4603540bedcd8c743965f3ee8c0119168dba

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - spdlog
    - azure-identity-cpp ==1.13.0
    - azure-storage-blobs-cpp ==12.14.0
    - azure-storage-files-shares-cpp ==12.14.0

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/lib/libkhiopsdriver_file_azure${SHLIB_EXT}
        else: if not exist %PREFIX%\Library\bin\libkhiopsdriver_file_azure.dll exit 1

about:
  homepage: https://khiops.org
  license: BSD-3-Clause-Clear
  license_file: LICENSE
  summary: Khiops driver to access files on Azure Cloud Storage
  description: The Azure driver plugin extends Khiops to enable processing of data files located on Azure Cloud Storage

extra:
  recipe-maintainers:
    - tpochon
    - bruno-at-orange
    - popescu-v
    - tristandeb1
    - sgouache
